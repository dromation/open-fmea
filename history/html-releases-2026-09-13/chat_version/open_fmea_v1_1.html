  function functions(){let rows=C.dfmea.slice(0,8).map((r,i)=>({id:'F-'+String(i+1).padStart(3,'0'),name:r.function||'Function '+(i+1),element:r.element||r.part||'System element',fmea:r.id,status:r.status||'Active'}));return genericList('Functions','Reusable system, product and process functions linked to requirements and FMEA items.',rows,[['id','ID'],['name','Function'],['element','Element / Process'],['fmea','Linked FMEA'],['status','Status']],'functions',[kpi('⊕','Functions','84','Loaded / derived'),kpi('⌘','Linked','78','92.9%','greenbg'),kpi('⚠','Unlinked','6','Needs review','orangebg')])}
  function systemchars(){let rows=(C.characteristics||[]).map((r,i)=>({...r,system:['Optical System','Electrical System','Housing System','Mounting System'][i%4],monitoring:'Monitored',target:['1200 ± 60','5700 ± 300','Per Spec','48 ± 2','13.5 ± 0.5','IP67'][i%6],unit:['lm','K','—','W','V','—'][i%6],linked:(i%3)+1+' FMEA'}));let main=`${header('System Characteristics Base','Define and manage system characteristics and their properties.')}<div class="kpis">${kpi('▣','Total Characteristics','142','All system characteristics')}${kpi('⬡','Critical Characteristics','28','19.7% of total','orangebg')}${kpi('●','Monitored Characteristics','96','67.6% of total','greenbg')}${kpi('⌘','Linked to FMEA','118','83.1% of total')}${kpi('♙','Organizations','3','Sources','purplebg')}</div><div class="panel">${filters('Search characteristics...')}${table(rows,[['id','Characteristic ID'],['name','Characteristic Name'],['system','System / Subsystem'],['type','Type'],['category','Category'],['importance','Importance'],['monitoring','Monitoring'],['target','Nominal Value / Target'],['unit','Unit'],['linked','Linked to FMEA']],'characteristics')}</div>`;return layout(main,detailGeneric(rows.find(x=>x.id===state.selected)||rows[0],'Characteristic Details'))}
  function processflow(){let steps=['10 Incoming Material','20 Cutting','30 Bending','40 Welding','50 Cleaning','60 Coating','70 Assembly','80 Functional Test','90 Visual Inspection','100 Packaging'];let main=`${header('Process Flow','Process steps, operations and links to PFMEA and process controls.')}<div class="panel"><div class="pb"><div class="flow">${steps.map((s,i)=>`<div class="flowbox" style="border-color:${i===3?'#2563eb':'var(--line)'}"><b>${s}</b><div class="muted">${i%3+1} PFMEA links</div></div>${i<steps.length-1?'<span class="arrow">→</span>':''}`).join('')}</div></div></div>`;return layout(main)}
  function ishikawa(){let a=C.problemSolving.ishikawa[0],cats=Object.entries(a.categories);let bones=cats.map(([k,v],i)=>`<div class="bone b${i+1}"><div class="btitle">${esc(k)}</div><div class="chips">${v.map(x=>`<div class="chip">${esc(x)}</div>`).join('')}</div></div>`).join('');let main=`${header('Ishikawa / 5M / 6M','Analyze potential causes using fishbone categories; promote only verified causes into authoritative FMEA data.')}<div class="kpis">${kpi('⌘','Analysis','ISH-001','Linked to FM-002')}${kpi('●','Categories','6','6M model','greenbg')}${kpi('⊕','Candidate Causes',cats.reduce((n,[,v])=>n+v.length,0),'Before verification','orangebg')}${kpi('✓','Selected','2','For verification','purplebg')}</div><div class="panel"><div class="ph"><div class="tabs"><span class="tab active">Ishikawa</span><span class="tab">5M</span><span class="tab">6M</span><span class="tab">Linked Evidence</span></div></div><div class="pb"><div class="fishbone"><div class="spine"></div>${bones}<div class="head">${esc(a.problem)}</div></div></div></div><div class="taxonomy"><div class="taxbox"><h4>5M</h4>${['Man','Machine','Method','Material','Measurement'].map(x=>`<span class="mini-tag">${x}</span>`).join('')}</div><div class="taxbox"><h4>6M</h4>${['Man','Machine','Method','Material','Measurement','Mother Nature / Environment'].map(x=>`<span class="mini-tag">${x}</span>`).join('')}</div><div class="taxbox"><h4>Poka-Yoke bridge</h4><p class="muted">Selected root causes can create prevention/detection proposals and link to process controls.</p><button class="btn" data-page="prevention">Open controls →</button></div></div>`;return layout(main,detailGeneric(a,'Analysis Details'))}
  function whyAnalysis(){let a=C.problemSolving.whyAnalyses[0];let chain=a.why.map((x,i)=>`<div class="whyrow"><div class="whybadge">WHY ${i+1}</div><div class="whybox">${esc(x)}</div><div class="whyarrow">↓</div></div>`).join('');let main=`${header('3WHY / 5WHY','Structured why-analysis linked directly to FMEA causes, actions and evidence.')}<div class="methodgrid"><div class="panel"><div class="ph">Analyses</div><div class="pb methodlist">${C.problemSolving.whyAnalyses.map((x,i)=>`<div class="methodcard ${i===0?'active':''}"><b>${x.id} · ${x.method}</b><small>${esc(x.problem)} · ${esc(x.status)}</small></div>`).join('')}</div></div><div><div class="panel"><div class="ph">${esc(a.problem)}</div><div class="pb whychain">${chain}<div class="whyrow"><div class="whybadge" style="background:#e8f8f2;color:#087a52">ROOT</div><div class="whybox"><b>${esc(a.rootCause)}</b><div class="muted">Requires evidence / verification before authoritative cause update.</div></div><div></div></div></div></div></div></div>`;return layout(main,detailGeneric(a,'Why Analysis'))}
  function eightd(){let a=C.problemSolving.eightD[0];let main=`${header('8D Problem Solving','Cross-functional 8D workflow linked to FMEA, containment, root cause, actions and lessons learned.')}<div class="kpis">${kpi('⑧','8D Case',a.id,a.status)}${kpi('✓','Completed','3','D1–D3','greenbg')}${kpi('⌘','Current Step','D4','Root Cause')}${kpi('⚠','Linked Risk','FM-002','Water ingress','orangebg')}</div><div class="panel"><div class="ph">${esc(a.title)}</div><div class="pb"><div class="dsteps">${a.steps.map(s=>`<div class="dstep ${s.status==='Completed'?'done':s.status==='In Progress'?'progress':'plan'}"><div class="dnum">${s.d}</div><b>${esc(s.title)}</b><div style="margin:7px 0">${pill(s.status)}</div><div class="muted">${esc(s.summary)}</div></div>`).join('')}</div></div></div><div class="grid3"><div class="panel"><div class="ph">Root Cause Tools</div><div class="pb"><button class="btn" data-page="ishikawa">Ishikawa / 6M</button> <button class="btn" data-page="whyanalysis">5WHY</button></div></div><div class="panel"><div class="ph">Corrective Action</div><div class="pb">Poka-Yoke fixture location + automated seat-depth detection.</div></div><div class="panel"><div class="ph">Prevention of Recurrence</div><div class="pb">PFMEA + Control Plan + lessons learned update.</div></div></div>`;return layout(main,detailGeneric(a,'8D Details'))}
  function xda(){return placeholders('XDA Investigations','Cross-domain investigation workspace connecting failures, complaints, causes, evidence, 8D and FMEA history.')}
  const pages={home,projects,team,context:contextPage,systemchars,charflow:charFlow,processflow,processctrl:processCtrl,dfmea:()=>fmeaPage('DFMEA'),pfmea:()=>fmeaPage('PFMEA'),systemfmea,pmfmea,functions,failuremodes:failureModes,effects,causes,prevention:()=>controlPage('Prevention'),detection:()=>controlPage('Detection'),actions,riskmatrix:riskMatrix,risktrajectory:riskTrajectory,evidence,validation,changeimpact:changeImpact,ishikawa,whyanalysis,eightd,xda};
  function render(){renderNav();let f=pages[state.page]||home;$('#page').innerHTML=f();$('#pageTitle').textContent=nav.flatMap(x=>x[1]).find(x=>x[0]===state.page)?.[2]||'Open FMEA';wire()}
  function wire(){$$('[data-page]').forEach(x=>x.onclick=()=>{state.page=x.dataset.page;state.selected=null;render()});$$('[data-row]').forEach(x=>x.onclick=()=>{state.selected=x.dataset.row;state.selectedType=x.dataset.type;render()});$$('[data-ai]').forEach(x=>x.onclick=openAI);$$('[data-clear]').forEach(x=>x.onclick=()=>{state.selected=null;render()});$$('[data-edit]').forEach(x=>x.onclick=()=>editRecord(x.dataset.edit));$$('[data-new]').forEach(x=>x.onclick=()=>newRecord(x.dataset.new));$$('[data-import]').forEach(x=>x.onclick=openContainer);$$('[data-export]').forEach(x=>x.onclick=saveContainer);$$('[data-save]').forEach(x=>x.onclick=saveSnapshot)}
  function addTx(kind,id,field,oldv,newv){C.transactions.push({id:'TX-'+String(C.transactions.length+1).padStart(5,'0'),at:new Date().toISOString(),user:'USR-JD',kind,objectId:id,field,oldValue:oldv,newValue:newv});state.dirty=true}
  function editRecord(id){let r=find(id);if(!r)return;let fields=Object.keys(r).filter(k=>!['id','stages'].includes(k)).slice(0,8);modal('Edit '+id,fields.map(k=>`<label>${esc(k)}<input data-field="${k}" value="${esc(r[k])}"></label>`).join(''),()=>{fields.forEach(k=>{let el=$(`[data-field="${k}"]`);let nv=el.value;if(String(r[k])!==nv){addTx('FIELD_UPDATE',id,k,r[k],nv);r[k]=isNaN(Number(nv))||nv.trim()===''?nv:Number(nv)}});C.manifest.knowledgeVersion++;rebuildKnowledge();render()})}
  function newRecord(title){modal('Create '+title,`<label>Name / title<input id="newName" value="New ${esc(title)}"></label><label>Status<select id="newStatus"><option>Open</option><option>In Progress</option><option>Active</option></select></label>`,()=>{let map={DFMEA:'dfmea',PFMEA:'pfmea','Failure Modes':'failureModes','Causes':'causes','Effects':'effects','Actions':'actions'};let key=map[title];if(!key)return;let arr=C[key];let id=(title==='DFMEA'?'DF-NEW-':title==='PFMEA'?'PF-NEW-':'NEW-')+(arr.length+1);let r={id,name:$('#newName').value,title:$('#newName').value,status:$('#newStatus').value};arr.push(r);addTx('CREATE',id,'record',null,r);rebuildKnowledge();render()})}
  function modal(title,body,onok){$('#modal').innerHTML=`<h3>${esc(title)}</h3><div class="formgrid">${body}</div><div class="foot"><button class="btn" id="mCancel">Cancel</button><button class="btn primary" id="mOk">Confirm</button></div>`;$('#modalBg').classList.add('open');$('#mCancel').onclick=()=>$('#modalBg').classList.remove('open');$('#mOk').onclick=()=>{onok&&onok();$('#modalBg').classList.remove('open')}}
  function rebuildKnowledge(){C.knowledge=allRecords().map(r=>({id:r.id,text:Object.entries(r).filter(([k,v])=>typeof v!=='object').map(([k,v])=>`${k}:${v}`).join(' | '),type:inferType(r.id)}));state.knowledge=C.knowledge}
  function inferType(id){if(id.startsWith('DF-'))return'DFMEA';if(id.startsWith('PF-'))return'PFMEA';if(id.startsWith('FM-'))return'FailureMode';if(id.startsWith('C-'))return'Cause';if(id.startsWith('E-'))return'Effect';if(id.startsWith('PC-'))return'PreventionControl';if(id.startsWith('DC-'))return'DetectionControl';if(id.startsWith('A-'))return'Action';return'Object'}
  function openAI(){state.aiOpen=true;$('#aiPanel').classList.add('open');let sel=find(state.selected);if(!$('#aiLog').children.length)aiMsg(`<span class="kind">CONTEXT</span>${sel?`Selected <b>${esc(sel.id)}</b> — ${esc(sel.name||sel.title||sel.failure||'')}`:'No item selected. I can analyze the full embedded open_fmea.container.'}`)}
  function aiMsg(t,user=false){let d=document.createElement('div');d.className='msg'+(user?' user':'');d.innerHTML=t;$('#aiLog').appendChild(d);$('#aiLog').scrollTop=99999}
  function aiAnswer(q){let l=q.toLowerCase(),sel=find(state.selected),parts=[];if(sel){parts.push(`<span class="kind">FACT</span>Selected object <b>${esc(sel.id)}</b> is ${esc(sel.name||sel.title||sel.failure||'')} with status ${esc(sel.status||'n/a')}.`);if(sel.rpn||sel.initial||sel.current)parts.push(`<span class="kind">CALCULATION</span>Risk context: initial/RPN ${esc(sel.initial??sel.rpn??'—')}, current ${esc(sel.current??'—')}.`)}if(l.includes('high risk')||l.includes('risk')){let hi=[...C.dfmea,...C.pfmea,...C.failureModes].filter(x=>(x.current??x.rpn??x.initial)>=100);parts.push(`<span class="kind">FACT</span>${hi.length} loaded demo items currently meet the ≥100 threshold.`);parts.push(`<span class="kind">RECOMMENDATION</span>Review ${hi.slice(0,3).map(x=>x.id).join(', ')} first and verify linked controls/actions.`)}else if(l.includes('cause')){let top=C.causes.slice().sort((a,b)=>b.influence-a.influence)[0];parts.push(`<span class="kind">INFERENCE</span>The strongest loaded cause signal is ${top.id} “${esc(top.name)}” with influence ${top.influence}/10.`)}else if(l.includes('action')){let open=C.actions.filter(a=>a.status!=='Completed');parts.push(`<span class="kind">FACT</span>${open.length} demo actions are still open or in progress.`)}else if(l.includes('ishikawa')||l.includes('5m')||l.includes('6m')){let a=C.problemSolving.ishikawa[0];parts.push(`<span class="kind">FACT</span>Ishikawa ${a.id} contains ${Object.values(a.categories).flat().length} candidate causes across ${Object.keys(a.categories).length} categories.`);parts.push(`<span class="kind">RECOMMENDATION</span>Verify selected causes before promoting them into FMEA.`)}else if(l.includes('5why')||l.includes('5 why')||l.includes('3why')||l.includes('3 why')){let a=C.problemSolving.whyAnalyses[0];parts.push(`<span class="kind">FACT</span>${a.id} currently proposes root cause: ${esc(a.rootCause)}.`)}else if(l.includes('8d')){let a=C.problemSolving.eightD[0];parts.push(`<span class="kind">FACT</span>${a.id} is at ${esc(a.status)} and is linked to ${esc(a.linkedObject)}.`)}else if(l.includes('poka')){parts.push(`<span class="kind">FACT</span>${C.problemSolving.pokaYokeCatalog.length} Poka-Yoke patterns are loaded in the container.`)}else if(l.includes('learn')||l.includes('knowledge')||l.includes('container')){parts.push(`<span class="kind">FACT</span>The AI knowledge layer indexes ${C.knowledge.length} records from the embedded container and rebuilds after approved edits.`);parts.push(`<span class="kind">RECOMMENDATION</span>Keep authoritative changes user-confirmed; use AI only for retrieval, comparison and proposals.`)}else parts.push(`<span class="kind">RECOMMENDATION</span>Ask me about risk, causes, actions, controls, validation, change impact, or the selected object.`);let src=sel?[sel.id]:[...C.failureModes.slice(0,2).map(x=>x.id),'open_fmea.container'];parts.push(`<div class="source">Sources: ${src.map(esc).join(', ')}</div>`);aiMsg(parts.join('<br><br>'))}
  function saveSnapshot(){localStorage.setItem('open_fmea_embedded_container',JSON.stringify(C));state.dirty=false;alert('Snapshot saved in browser local storage. The single HTML file remains unchanged.')}
  function saveContainer(){let blob=new Blob([JSON.stringify(C,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='open_fmea.container';a.click();URL.revokeObjectURL(a.href)}
  function openContainer(){let i=document.createElement('input');i.type='file';i.accept='.container,.json';i.onchange=()=>{let f=i.files[0];if(!f)return;let fr=new FileReader();fr.onload=()=>{try{let d=JSON.parse(fr.result);Object.keys(C).forEach(k=>delete C[k]);Object.assign(C,d);rebuildKnowledge();render();alert('Container loaded into the single HTML runtime.')}catch(e){alert('Invalid container: '+e.message)}};fr.readAsText(f)};i.click()}
  function init(){let saved=localStorage.getItem('open_fmea_embedded_container');if(saved){try{let d=JSON.parse(saved);Object.keys(C).forEach(k=>delete C[k]);Object.assign(C,d)}catch(e){}}rebuildKnowledge();render();$('#aiClose').onclick=()=>$('#aiPanel').classList.remove('open');$('#aiSend').onclick=()=>{let q=$('#aiInput').value.trim();if(!q)return;aiMsg(esc(q),true);$('#aiInput').value='';aiAnswer(q)};$('#aiInput').onkeydown=e=>{if(e.key==='Enter')$('#aiSend').click()};$('#globalSearch').onkeydown=e=>{if(e.key==='Enter'){let q=e.target.value.toLowerCase();let hit=allRecords().find(r=>JSON.stringify(r).toLowerCase().includes(q));if(hit){state.selected=hit.id;let t=inferType(hit.id);state.page=t==='DFMEA'?'dfmea':t==='PFMEA'?'pfmea':t==='FailureMode'?'failuremodes':t==='Cause'?'causes':t==='Effect'?'effects':t==='PreventionControl'?'prevention':t==='DetectionControl'?'detection':'home';render()}}};document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#globalSearch').focus()}})}
  return{init,C,state,render};
})();
document.addEventListener('DOMContentLoaded',OFMEA.init);
window.OFMEA=OFMEA;
