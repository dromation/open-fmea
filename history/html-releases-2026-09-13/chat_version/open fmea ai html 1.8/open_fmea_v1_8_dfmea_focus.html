<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Open FMEA</title>
<style>
:root{
  --bg:#f5f7fb;--panel:#fff;--panel2:#f8fafc;--line:#e4e9f1;--text:#111827;--muted:#667085;
  --blue:#075de8;--blue2:#eaf2ff;--nav:#06213b;--nav2:#071a2d;--green:#12a36d;--green2:#e8f8f2;
  --orange:#f59e0b;--orange2:#fff6df;--red:#e53935;--red2:#fff0ef;--purple:#7c3aed;--purple2:#f2ecff;
  --cyan:#0891b2;--gray:#98a2b3;--radius:10px;--shadow:0 1px 2px rgba(16,24,40,.04),0 2px 8px rgba(16,24,40,.04);
  --navw:222px;--top:66px;--right:320px;
}
*{box-sizing:border-box} html,body{margin:0;height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--text);background:var(--bg);font-size:13px}
body{overflow:hidden}.hidden{display:none!important}button,input,select,textarea{font:inherit}.muted{color:var(--muted)}
#app{display:grid;grid-template-columns:var(--navw) minmax(0,1fr);grid-template-rows:var(--top) 1fr;height:100vh}
.sidebar{grid-row:1/3;background:linear-gradient(180deg,var(--nav),var(--nav2));color:#fff;overflow:auto;padding:16px 10px 14px}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px 18px}.brand-mark{width:42px;height:42px;position:relative;flex:0 0 42px}
.brand-mark:before,.brand-mark:after{content:"";position:absolute;left:17px;top:1px;width:8px;height:40px;border-radius:7px;transform-origin:center;background:linear-gradient(to bottom,#19a7ff 0 48%,#f24444 52% 100%);transform:rotate(45deg)}
.brand-mark:after{background:linear-gradient(to bottom,#64d04d 0 48%,#f5b71b 52% 100%);transform:rotate(-45deg)}
.brand-mark{filter:drop-shadow(0 1px 1px rgba(0,0,0,.15))}.brand b{font-size:20px}.brand small{display:block;color:#c7d6e6;margin-top:2px}
.navgrp{font-size:10px;color:#a9bed1;text-transform:uppercase;letter-spacing:.06em;margin:14px 8px 6px}.navbtn{width:100%;display:flex;align-items:center;gap:9px;background:transparent;border:0;color:#eef5fb;padding:8px 9px;border-radius:6px;text-align:left}.navbtn:hover{background:rgba(255,255,255,.07)}.navbtn.active{background:linear-gradient(90deg,#0e66f2,#0757d9)}.navbtn .ic{width:18px;text-align:center;opacity:.95}.navbtn .badge{margin-left:auto;background:#173653;color:#b9d1e3;border-radius:999px;padding:1px 6px;font-size:10px}.subnav{padding-left:16px}.subnav .navbtn{font-size:12px;color:#d6e3ef}
.topbar{grid-column:2;display:flex;align-items:center;gap:12px;background:#fff;border-bottom:1px solid var(--line);padding:0 18px;z-index:4}.hamb{font-size:22px;border:0;background:none}.title{font-size:18px;font-weight:700;margin-right:auto}.project-select,.search{height:38px;border:1px solid var(--line);background:#fff;border-radius:7px;padding:0 12px}.project-select{min-width:250px}.search{width:200px}.topicon{width:36px;height:36px;border:0;background:#fff;border-radius:50%;font-size:17px}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#4f6fdc;color:#fff;position:relative}.avatar:after{content:"";position:absolute;width:8px;height:8px;border-radius:50%;background:#13b76a;right:0;bottom:0;border:2px solid #fff}
.main{grid-column:2;overflow:auto;padding:14px 16px 28px}.layout{display:grid;grid-template-columns:minmax(0,1fr) var(--right);gap:12px}.layout.no-right{grid-template-columns:minmax(0,1fr)}.content{min-width:0}.rightcol{min-width:0}
.pagehead{display:flex;align-items:flex-start;gap:12px;margin:2px 2px 12px}.pagehead h1{font-size:22px;margin:0 0 3px}.pagehead p{margin:0;color:var(--muted)}.actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:8px 11px;color:#1f2937}.btn:hover{background:#f8fafc}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.soft{background:#f7f9fc}.btn.ai{color:#6d28d9}.btn.danger{color:var(--red)}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(115px,1fr));gap:10px;margin-bottom:12px}.kpi{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px;box-shadow:var(--shadow);min-height:98px}.kpi .top{display:flex;align-items:center;gap:10px}.kpi .ico{width:42px;height:42px;border-radius:9px;display:grid;place-items:center;font-size:22px}.kpi .lab{font-size:11px;font-weight:600}.kpi .val{font-size:25px;font-weight:700;line-height:1.1;margin:6px 0 4px}.kpi .foot{font-size:11px;color:var(--muted)}.bluebg{background:var(--blue2);color:var(--blue)}.greenbg{background:var(--green2);color:var(--green)}.orangebg{background:var(--orange2);color:var(--orange)}.redbg{background:var(--red2);color:var(--red)}.purplebg{background:var(--purple2);color:var(--purple)}
.panel{background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}.ph{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);font-weight:700}.ph .tabs{display:flex;gap:24px;font-weight:500}.tab{padding:12px 0 10px;border-bottom:2px solid transparent;color:#344054;cursor:pointer}.tab.active{color:var(--blue);border-color:var(--blue)}.pb{padding:14px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.filters{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}.filters input,.filters select{height:34px;border:1px solid var(--line);border-radius:6px;padding:0 10px;background:#fff}.filters input{min-width:170px}.filters .spacer{flex:1}
.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:11px}th{background:#fbfcfe;color:#475467;text-align:left;font-weight:600;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}td{padding:9px 10px;border-bottom:1px solid #edf0f4;vertical-align:middle}tbody tr{cursor:pointer}tbody tr:hover{background:#f7faff}tbody tr.sel{background:#eef5ff}.idlink{color:var(--blue);font-weight:600}.pill{display:inline-flex;align-items:center;border-radius:5px;padding:3px 6px;font-size:10px;white-space:nowrap}.p-blue{background:#e8f0ff;color:#075de8}.p-green{background:#e5f6ef;color:#087a52}.p-orange{background:#fff2df;color:#c56900}.p-red{background:#ffe8e7;color:#d92d20}.p-purple{background:#f1e8ff;color:#6d28d9}.p-gray{background:#f2f4f7;color:#475467}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.detail{background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);min-height:180px}.detail .dh{display:flex;align-items:center;padding:14px;border-bottom:1px solid var(--line)}.detail .dh h3{margin:0;font-size:15px}.detail .db{padding:14px}.kv{display:grid;grid-template-columns:115px 1fr;gap:8px 10px;font-size:11px;margin-bottom:7px}.kv .k{color:#667085}.section-title{font-size:12px;font-weight:700;margin:15px 0 8px}.bigid{font-size:20px;font-weight:700;margin:2px 0 10px}.scoregrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:10px 0}.score{border:1px solid var(--line);border-radius:6px;padding:9px;text-align:center}.score b{font-size:20px;display:block}.mini-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.chartbox{height:220px;position:relative}.donut{width:132px;height:132px;border-radius:50%;background:conic-gradient(var(--green) 0 55%,var(--orange) 55% 82%,var(--red) 82% 95%,#98a2b3 95%);display:grid;place-items:center;margin:auto}.donut:after{content:"";width:82px;height:82px;border-radius:50%;background:#fff}.donut-label{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;font-weight:700}.barrow{display:grid;grid-template-columns:130px 1fr 42px;align-items:center;gap:8px;margin:9px 0;font-size:11px}.bar{height:8px;background:#edf0f4;border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue);border-radius:999px}.timeline{display:flex;align-items:center;gap:0;padding:22px 8px 18px}.stage{flex:1;text-align:center;position:relative}.stage:not(:last-child):after{content:"";position:absolute;left:55%;right:-45%;top:10px;height:2px;background:#ccd7e5}.stage .ball{width:18px;height:18px;border-radius:50%;margin:0 auto 8px;border:2px solid var(--blue);background:#fff;position:relative;z-index:1}.stage.done .ball{background:var(--green);border-color:var(--green)}.stage.plan .ball{border-color:var(--orange)}.stage label{font-size:10px;color:#475467}
.matrix{display:grid;grid-template-columns:42px repeat(5,1fr);gap:1px;background:#fff}.mcell{min-height:48px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.45);font-size:11px}.mhead{background:#f8fafc;font-weight:600}.risk-l{background:#bde5c9}.risk-m{background:#ffe8a3}.risk-h{background:#ffb347}.risk-vh{background:#ef6b61;color:#fff}.risk-ext{background:#d93630;color:#fff}.nodegraph{min-height:370px;position:relative;background:linear-gradient(#fff,#fcfdff)}.node{position:absolute;width:86px;height:86px;border-radius:50%;display:grid;place-items:center;text-align:center;color:#fff;font-size:10px;padding:8px;box-shadow:0 3px 10px rgba(0,0,0,.12)}.node.center{left:45%;top:39%;background:#2563eb}.node.n1{left:46%;top:7%;background:#e11d48}.node.n2{left:74%;top:18%;background:#f97316}.node.n3{left:78%;top:57%;background:#f59e0b}.node.n4{left:45%;top:72%;background:#eab308}.node.n5{left:18%;top:60%;background:#eab308}.node.n6{left:15%;top:20%;background:#f97316}.node.n7{left:8%;top:40%;background:#059669}.connector{position:absolute;height:2px;background:#b6c4d7;transform-origin:left center}.c1{left:49%;top:39%;width:105px;transform:rotate(-90deg)}.c2{left:53%;top:45%;width:195px;transform:rotate(-27deg)}.c3{left:53%;top:49%;width:205px;transform:rotate(22deg)}.c4{left:50%;top:54%;width:120px;transform:rotate(90deg)}.c5{left:45%;top:51%;width:195px;transform:rotate(155deg)}.c6{left:45%;top:45%;width:190px;transform:rotate(208deg)}.c7{left:45%;top:48%;width:230px;transform:rotate(180deg)}
.flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.flowbox{border:1px solid var(--line);border-radius:6px;padding:10px;min-width:120px;background:#f9fbfe}.arrow{color:#98a2b3;font-size:18px}.spark{height:80px;position:relative}.spark svg{width:100%;height:100%}.summarycards{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.smallcard{border:1px solid var(--line);border-radius:7px;padding:10px;background:#fff}.smallcard b{display:block;font-size:20px;margin-top:4px}
.ai-panel{position:fixed;right:18px;bottom:18px;width:390px;max-height:72vh;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 20px 50px rgba(16,24,40,.18);z-index:30;display:none;overflow:hidden}.ai-panel.open{display:flex;flex-direction:column}.ai-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);font-weight:700}.ai-log{padding:12px;overflow:auto;min-height:180px}.msg{border-radius:8px;padding:9px 10px;margin:7px 0;background:#f5f7fb}.msg.user{background:#eaf2ff}.ai-input{display:flex;gap:7px;padding:10px;border-top:1px solid var(--line)}.ai-input input{flex:1;border:1px solid var(--line);border-radius:6px;padding:9px}.source{font-size:10px;color:#667085;margin-top:5px}.kind{font-size:9px;border-radius:4px;background:#f2f4f7;padding:2px 4px;margin-right:5px}
.modalbg{position:fixed;inset:0;background:rgba(15,23,42,.3);display:none;place-items:center;z-index:40}.modalbg.open{display:grid}.modal{width:min(620px,92vw);background:#fff;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.2);padding:18px}.modal h3{margin:0 0 14px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.formgrid label{font-size:11px;color:#667085}.formgrid input,.formgrid select,.formgrid textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:8px;margin-top:4px}.modal .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.footerline{display:flex;gap:30px;color:#667085;font-size:10px;padding:8px 12px;border-top:1px solid var(--line);background:#fff}.homegrid{display:grid;grid-template-columns:1.05fr 1.4fr 1.1fr;gap:10px}.homebottom{display:grid;grid-template-columns:1fr 1.2fr 1fr 1.2fr;gap:10px}.processlist{list-style:none;padding:0;margin:6px 0}.processlist li{padding:8px;border-left:1px solid #d0d5dd;margin-left:7px}.processlist li.active{background:#eef5ff;color:var(--blue);border-radius:5px}.riskline{display:grid;grid-template-columns:120px repeat(6,1fr) 30px;align-items:center;gap:0;margin:9px 0}.riskline .seg{height:2px;background:#ccd5e2}.riskline .pt{width:9px;height:9px;border-radius:50%;background:var(--green);justify-self:center}.riskline .pt.hot{background:var(--red)}.riskline .pt.mid{background:var(--orange)}
@media(max-width:1200px){:root{--right:280px}.kpis{grid-template-columns:repeat(3,1fr)}.homegrid,.homebottom{grid-template-columns:1fr 1fr}.project-select{min-width:190px}.summarycards{grid-template-columns:repeat(3,1fr)}}
@media(max-width:900px){:root{--navw:66px}.brand .txt,.navbtn span:not(.ic),.navgrp,.subnav{display:none}.sidebar{padding:12px 8px}.layout{grid-template-columns:1fr}.rightcol{display:none}.kpis{grid-template-columns:repeat(2,1fr)}.homegrid,.homebottom,.grid2,.grid3,.grid4,.grid5{grid-template-columns:1fr}.search{display:none}.project-select{min-width:140px;width:140px}}

/* Open FMEA v1.2 problem-solving workspaces */
.fishbone{position:relative;min-height:390px;margin:12px 4px 4px;padding:30px 150px 30px 20px;overflow:hidden}
.fish-spine{position:absolute;left:10%;right:14%;top:50%;height:3px;background:#8ba2bd}
.fish-head{position:absolute;right:1%;top:42%;width:150px;padding:12px;border:2px solid var(--red);border-radius:10px;background:var(--red2);text-align:center}
.fish-cat{position:absolute;width:205px;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff;box-shadow:var(--shadow)}
.fish-cat b{display:block;color:var(--blue);margin-bottom:6px}.fish-cat span{display:block;font-size:11px;margin:4px 0;color:#344054}
.fc0{left:8%;top:4%}.fc1{left:36%;top:4%}.fc2{left:64%;top:4%}.fc3{left:8%;bottom:4%}.fc4{left:36%;bottom:4%}.fc5{left:64%;bottom:4%}
.fc0:after,.fc1:after,.fc2:after{content:"";position:absolute;width:75px;height:2px;background:#8ba2bd;right:-60px;bottom:-28px;transform:rotate(35deg)}
.fc3:after,.fc4:after,.fc5:after{content:"";position:absolute;width:75px;height:2px;background:#8ba2bd;right:-60px;top:-28px;transform:rotate(-35deg)}
.why-chain{max-width:900px;margin:10px auto}.why-step{display:grid;grid-template-columns:42px 1fr;gap:12px;align-items:start;border:1px solid var(--line);border-radius:10px;padding:12px;background:#fff}.why-n{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--blue);color:#fff;font-weight:800}.why-step p{margin:4px 0 0;color:var(--muted)}.why-arrow{text-align:center;font-size:22px;color:var(--blue);height:28px}
.dgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.dcard{display:grid;grid-template-columns:54px 1fr;gap:10px;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff}.dtag{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;background:var(--blue2);color:var(--blue);font-weight:800;font-size:16px}.dcard p{margin:4px 0;color:var(--muted)}
.flowcards{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.flowcard{padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);font-weight:700}.arr{color:var(--blue);font-weight:800}
@media(max-width:1100px){.fish-cat{width:165px}.dgrid{grid-template-columns:1fr}}


/* ===== Open FMEA v1.3 functional runtime ===== */
.sidebar{transition:width .18s ease}
body.sidebar-collapsed .sidebar{width:58px}
body.sidebar-collapsed .sidebar .brand .txt,
body.sidebar-collapsed .sidebar .navgrp,
body.sidebar-collapsed .sidebar .navbtn span:not(.ic){display:none}
body.sidebar-collapsed .sidebar .brand{padding:13px 8px;justify-content:center}
body.sidebar-collapsed .sidebar .navbtn{justify-content:center;padding-left:8px;padding-right:8px}
body.sidebar-collapsed .topbar{left:58px}
body.sidebar-collapsed .main{margin-left:58px}
.topbar,.main{transition:left .18s ease,margin-left .18s ease}
.btn,.navbtn,.tab,.kpi,.node,.flowbox,.smallcard{user-select:none}
.btn:not(:disabled),.navbtn,.tab,.node,.flowbox,.processlist li,th[data-sort]{cursor:pointer}
.btn:disabled{opacity:.45;cursor:not-allowed}
.kpi[data-target]{cursor:pointer}.kpi[data-target]:hover{outline:2px solid #bfdbfe}
.tablewrap table thead th{position:sticky;top:0;background:var(--panel);z-index:2}
th[data-sort]:hover{background:var(--blue2)}
th .sortmark{font-size:9px;color:#94a3b8;margin-left:4px}
tr.filtered-out{display:none}
.table-tools{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
.pager{display:flex;gap:4px}.pager button{padding:4px 8px;border:1px solid var(--line);background:#fff;border-radius:6px}.pager button.active{background:var(--blue);color:white}
.toast-stack{position:fixed;right:18px;bottom:18px;z-index:1000;display:grid;gap:8px;max-width:420px}
.toast{background:#101828;color:white;padding:10px 13px;border-radius:9px;box-shadow:0 8px 28px rgba(0,0,0,.22);font-size:12px;animation:toastin .18s ease}
.toast.ok{background:#067647}.toast.warn{background:#b54708}.toast.err{background:#b42318}
@keyframes toastin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.search-pop{position:fixed;top:54px;right:142px;width:420px;max-height:390px;overflow:auto;background:white;border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 40px rgba(16,24,40,.18);z-index:800;display:none}
.search-pop.open{display:block}.search-hit{padding:10px 12px;border-bottom:1px solid #eef2f6;cursor:pointer}.search-hit:hover{background:#f5f8ff}.search-hit b{color:var(--blue)}
.context-menu{display:grid;gap:8px}.context-menu .btn{text-align:left;justify-content:flex-start}
.history-list{max-height:420px;overflow:auto}.history-item{padding:9px 0;border-bottom:1px solid var(--line)}.history-item small{color:var(--muted)}
.modal textarea{min-height:90px;resize:vertical}
.modal .wide{grid-column:1/-1}
.dirty-dot{width:8px;height:8px;border-radius:50%;background:#f79009;display:inline-block;margin-left:6px}
.linklike{color:var(--blue);cursor:pointer;text-decoration:none}.linklike:hover{text-decoration:underline}
.matrix .mcell[data-riskcell]:hover{outline:2px solid #111827;outline-offset:-2px;cursor:pointer}
.node[data-node]{cursor:pointer}.node[data-node]:hover{transform:scale(1.04);box-shadow:0 6px 18px rgba(37,99,235,.2)}
.processlist li{transition:.12s}.processlist li:hover{background:#eff6ff}
.editable-chip{display:inline-flex;align-items:center;gap:4px;padding:3px 6px;border:1px solid var(--line);border-radius:6px}
.toolbar-menu{display:flex;gap:8px;flex-wrap:wrap}
.audit-badge{font-size:10px;padding:2px 6px;border-radius:999px;background:#eef4ff;color:#3538cd}
@media(max-width:900px){
  .search-pop{left:70px;right:12px;width:auto}
  body.sidebar-collapsed .topbar{left:0}
  body.sidebar-collapsed .main{margin-left:0}
}


/* v1.4 runtime hardening */
.errorbox{border:1px solid #fda29b;background:#fef3f2;color:#912018;padding:14px;border-radius:10px;margin:12px}.diag-ok{color:#067647}.diag-warn{color:#b54708}.diag-bad{color:#b42318}.clickstage{cursor:pointer}.clickstage:hover{outline:2px solid #2563eb;border-radius:999px}.rel-link{color:var(--blue);cursor:pointer}.rel-link:hover{text-decoration:underline}.calc-note{font-size:10px;color:var(--muted)}


/* ===== v1.5 Risk Matrix + Trajectory ===== */
.matrix .mcell{position:relative}
.risk-count{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  min-width:24px;height:24px;padding:0 6px;border-radius:999px;
  background:#111827;color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:800;box-shadow:0 1px 4px rgba(0,0,0,.28);
  cursor:pointer;border:2px solid rgba(255,255,255,.75)
}
.risk-count:hover{transform:translate(-50%,-50%) scale(1.12)}
.matrix-selection{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.matrix-selection .chip{padding:4px 8px;border-radius:999px;background:var(--blue2);color:var(--blue);font-size:11px;font-weight:700}
.trajectory-controls{display:flex;gap:8px;align-items:end;flex-wrap:wrap}
.trajectory-controls label{font-size:10px;color:var(--muted);display:grid;gap:4px}
.trajectory-controls select,.trajectory-controls input{
  height:32px;border:1px solid var(--line);border-radius:7px;background:#fff;padding:0 8px;font:inherit;color:var(--text)
}
.timeline-grid{overflow:auto}
.timeline-head,.timeline-row{display:grid;align-items:center;min-width:900px}
.timeline-head{grid-template-columns:190px 90px repeat(var(--cols),minmax(105px,1fr));border-bottom:1px solid var(--line);font-size:10px;color:var(--muted);font-weight:700}

<script>
const OFMEA=(()=>{
  const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
  const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
  const C=JSON.parse($('#open-fmea-container').textContent);
  const state={page:'home',selected:null,selectedType:null,dirty:false,tx:[],knowledge:[],aiOpen:false,project:'New Headlamp X1',sidebarCollapsed:false,tablePageSize:10,filterVisible:true,sort:{},lastSearch:'',riskMatrixS:null,riskMatrixO:null,trajectoryMode:'lifecycle',trajectoryRange:'all',trajectoryFrom:'',trajectoryTo:'',changeTimeMode:'week',changeTimeRange:'6w',sppSelected:'SYS-001',dfmeaTab:'table'};
  const nav=[
    ['FMEA WORKSPACE',[['home','⌂','Home'],['projects','▣','FMEA Projects'],['team','♙','FMEA Team']]],
    ['CONTEXT (from Open-EQMS)',[['context','◫','System / Product / Process'],['systemchars','◇','System Characteristics'],['charflow','⌘','Characteristics Flow / Diagram'],['processflow','⌘','Process Flow'],['processctrl','⊞','Process Control Characteristics']]],
    ['FMEA ANALYSIS',[['dfmea','▣','DFMEA'],['pfmea','▣','PFMEA'],['systemfmea','♧','System FMEA'],['pmfmea','◉','Preventive FMEA (PM-FMEA)']]],
    ['FMEA ELEMENTS',[['functions','⊕','Functions'],['failuremodes','◉','Failure Modes'],['effects','⊙','Effects'],['causes','⊕','Causes'],['prevention','▦','Prevention Controls'],['detection','⊕','Detection Controls'],['actions','◉','Actions']]],
    ['RISK & INSIGHTS',[['riskmatrix','⌘','Risk Matrix'],['risktrajectory','⌁','Risk Trajectory & Propagation'],['changeimpact','◉','Change Impact']]],
    ['VALIDATION & CHANGE',[['evidence','▤','Evidence & Tests'],['validation','⌁','Validation Trajectory']]],
    ['PROBLEM SOLVING',[['rca','◎','RCA / Investigations'],['ishikawa','⌘','Ishikawa / 5M / 6M'],['why','?','3WHY / 5WHY'],['eightd','8','8D Problem Solving'],['pokayoke','◇','Poka-Yoke']]],
    ['SOFTWARE & LEARNING',[['softwarechars','⌘','Software Characteristics'],['reqgaps','?','Requirement Gaps'],['fmeacreation','◈','FMEA Creation Project'],['learning','✦','Learning & Knowledge']]],
    ['SYSTEM TOOLS',[['diagnostics','✓','Diagnostics / Integrity']]],

  function allRecords(){let keys=['dfmea','pfmea','failureModes','causes','effects','preventionControls','detectionControls','processControls','actions','evidence','validations','changes','characteristics','rootCauseAnalyses','eightD','pokaYoke','softwareCharacteristics','requirementGaps','learningCases','fmeaCreationProjects','projects','users','systemTree','functions','designElements','interfaces','parameterDiagrams','validationFindings'];return keys.flatMap(k=>Array.isArray(C[k])?C[k]:[])}
  function find(id){return allRecords().find(x=>x.id===id)}
  function pill(v){let s=String(v||'');let c=/critical|extreme|high|overdue/i.test(s)?'p-red':/progress|medium|review|planned|under analysis/i.test(s)?'p-orange':/active|closed|completed|effective|low/i.test(s)?'p-green':'p-blue';return `<span class="pill ${c}">${esc(s)}</span>`}
  function kpi(icon,label,val,foot,cls='bluebg'){return `<div class="kpi"><div class="top"><div class="ico ${cls}">${icon}</div><div><div class="lab">${label}</div><div class="val">${val}</div><div class="foot">${foot}</div></div></div></div>`}
  function header(title,desc,buttons=true){return `<div class="pagehead"><div><h1>${esc(title)}</h1><p>${esc(desc)}</p></div>${buttons?`<div class="actions"><button class="btn primary" data-new="${esc(title)}">＋ New</button><button class="btn" data-import-menu>⇩ Import</button><button class="btn" data-export-menu>⇧ Export</button><button class="btn" data-report>▣ Reports⌄</button><button class="btn" data-toggle-filters>☷ Filters⌄</button><button class="btn ai" data-ai>✦ AI Assistant</button></div>`:''}</div>`}
  function table(data,cols,type){return `<div class="tablewrap" data-datatable="${esc(type)}"><table><thead><tr>${cols.map((c,i)=>`<th data-sort="${i}" data-key="${esc(c[0])}">${c[1]}<span class="sortmark">↕</span></th>`).join('')}</tr></thead><tbody>${data.map(r=>`<tr data-row="${r.id}" data-type="${type}" class="${state.selected===r.id?'sel':''}">${cols.map(c=>`<td data-key="${esc(c[0])}">${cell(r,c[0])}</td>`).join('')}</tr>`).join('')}</tbody></table><div class="table-tools"><span data-table-count>${data.length} record(s)</span><div class="pager" data-pager></div></div></div>`}
  function cell(r,k){let v=r[k];if(k==='id')return `<span class="idlink">${esc(v)}</span>`;if(['status','priority','impact','importance','ap'].includes(k))return pill(v);if(['current','rpn','initial'].includes(k))return `<b style="color:${Number(v)>=120?'var(--red)':Number(v)>=60?'var(--orange)':'var(--green)'}">${esc(v)}</b>`;if(k==='effectiveness'&&typeof v==='number')return `<b style="color:${v>=80?'var(--green)':v>=60?'var(--orange)':'var(--red)'}">${v}%</b>`;if(k==='complete')return `<div class="bar"><i style="width:${v}%"></i></div><small>${v}%</small>`;return esc(v)}

  function recalcRecord(r,mode='current'){
    if(!r)return r;
    let S=Number(r.s),O=Number(r.o),D=Number(r.d);
    if([S,O,D].every(x=>Number.isFinite(x)&&x>0)){
      let val=S*O*D;
      if('rpn' in r) r.rpn=val;

    }
    return r;
  }

  function applyTableFeatures(root=document){
    root.querySelectorAll('[data-datatable]').forEach(wrap=>{
      let rows=[...wrap.querySelectorAll('tbody tr')], page=1, size=state.tablePageSize, sortDir=1, sortIndex=-1;
      const refresh=()=>{
        let visible=rows.filter(r=>!r.classList.contains('filtered-out'));
        let pages=Math.max(1,Math.ceil(visible.length/size)); if(page>pages)page=pages;
        rows.forEach(r=>r.style.display='none');
        visible.slice((page-1)*size,page*size).forEach(r=>r.style.display='');
        let count=wrap.querySelector('[data-table-count]');if(count)count.textContent=`${visible.length} matching record(s)`;
        let pg=wrap.querySelector('[data-pager]');if(pg){pg.innerHTML='';for(let i=1;i<=pages;i++){let b=document.createElement('button');b.textContent=i;b.className=i===page?'active':'';b.onclick=e=>{e.stopPropagation();page=i;refresh()};pg.appendChild(b)}}
      };
      wrap.closest('.panel')?.querySelectorAll('[data-table-search],[data-table-filter]').forEach(el=>{
        el.oninput=el.onchange=()=>{
          let bar=el.closest('[data-filterbar]'),q=(bar?.querySelector('[data-table-search]')?.value||'').trim().toLowerCase();
          let fs=[...(bar?.querySelectorAll('[data-table-filter]')||[])].map(x=>x.value.trim().toLowerCase()).filter(Boolean);
          rows.forEach(r=>{let t=r.innerText.toLowerCase();r.classList.toggle('filtered-out',!( (!q||t.includes(q)) && fs.every(f=>t.includes(f)) ))});
          page=1;refresh();
        };
      });
      wrap.querySelectorAll('th[data-sort]').forEach(th=>th.onclick=()=>{
        let i=Number(th.dataset.sort);sortDir=(sortIndex===i?-sortDir:1);sortIndex=i;
        rows.sort((a,b)=>{let av=a.children[i]?.innerText.trim()||'',bv=b.children[i]?.innerText.trim()||'';let an=Number(av.replace(/[^0-9.-]/g,'')),bn=Number(bv.replace(/[^0-9.-]/g,''));let c=(!isNaN(an)&&!isNaN(bn)&&av!==''&&bv!=='')?an-bn:av.localeCompare(bv);return c*sortDir});
        let tb=wrap.querySelector('tbody');rows.forEach(r=>tb.appendChild(r));refresh();
      });
      refresh();
    });
  }

  function tokenizeText(s){return String(s||'').toLowerCase().replace(/[^a-z0-9čšž]+/gi,' ').split(/\s+/).filter(x=>x.length>2)}
  function caseScore(query,c){let q=new Set(tokenizeText(query)),t=new Set(tokenizeText([c.title,c.failureMode,c.cause,c.action,...(c.lessons||[]),...(c.methods||[])].join(' '))),similarity=[...q].filter(x=>t.has(x)).length/(new Set([...q,...t]).size||1);return similarity*.65+Math.max(0,Math.min(1,Number(c.qualityScore||0)))*.2+(c.approved?.1:0)+(c.sources?.length?.05:0)}
  function suggestFromGap(g){
    let cases=(C.learningCases||[]).filter(c=>c.approved).map(c=>({c,score:caseScore(g.text+' '+g.potentialFailureMode+' '+g.area,c)})).sort((a,b)=>b.score-a.score).slice(0,3);
    return {gap:g,cases,methods:['Requirement Gap Analysis','6M / Ishikawa',g.severity>=8?'5WHY':'3WHY','Poka-Yoke Review','Change Impact'],confidence:Math.min(.95,.5+(cases[0]?.score||0))};
  }

    $$('[data-dfmea-tab]').forEach(x=>x.onclick=()=>{state.dfmeaTab=x.dataset.dfmeaTab;render()});

        applyTableFeatures($('#page'));

  function addTx(kind,id,field,oldv,newv){C.transactions=C.transactions||[];C.transactions.push({id:nextId('transactions','TX'),at:new Date().toISOString(),user:'USR-JD',kind,objectType:inferType(id),objectId:id,field,oldValue:oldv===undefined?null:structuredClone(oldv),newValue:newv===undefined?null:structuredClone(newv),source:state.page});markDirty(true);setTimeout(()=>persist(true),0)}
  function editRecord(id){let r=find(id);if(!r)return;if(C.dfmea.includes(r))return editDfmea(id);let fields=Object.keys(r).filter(k=>!['id','rpn','current','initial'].includes(k)&&['string','number'].includes(typeof r[k]));modal('Edit '+id,fields.map(k=>`<label ${String(r[k]).length>70?'class="wide"':''}>${esc(k)}<input data-field="${esc(k)}" value="${esc(r[k])}"></label>`).join(''),()=>{let old=structuredClone(r),next=structuredClone(r);for(let k of fields){let value=$(`[data-field="${k}"]`).value;next[k]=typeof r[k]==='number'?Number(value):value;if(typeof r[k]==='number'&&!Number.isFinite(next[k]))throw Error('Invalid number: '+k)}let rated=['s','o','d'].some(k=>next[k]!==r[k]);if(rated){if(!validRatings(next))throw Error('S/O/D must be whole numbers from 1 to 10.');recalcRecord(next);next.ratingStatus='Consistent'}Object.assign(r,next);r.updatedAt=new Date().toISOString();if(rated)C.riskHistory.push({id:nextId('riskHistory','RH'),objectId:id,date:r.updatedAt.slice(0,10),at:r.updatedAt,phase:'Review',rpn:r.current??r.rpn,source:'User rating edit'});addTx('FIELD_UPDATE',id,'record',old,r);rebuildKnowledge();persist();render()})}
  function newRecord(title){
    let map={
      'Functions':'functions','DFMEA':'dfmea','PFMEA':'pfmea','Failure Modes':'failureModes','Causes':'causes','Effects':'effects',
      'Prevention Controls':'preventionControls','Detection Controls':'detectionControls',
      'Process Control Characteristics':'processControls','Actions':'actions','Evidence & Tests':'evidence',
      'Validation Trajectory':'validations','Change Impact':'changes','RCA / Investigations':'rootCauseAnalyses',
      '8D Problem Solving':'eightD','Poka-Yoke':'pokaYoke','Characteristics Flow / Diagram':'characteristics'
    };
    let key=map[title]||({failuremodes:'failureModes'}[state.page]);if(!key||!Array.isArray(C[key])){toast(`Creation form for “${title}” is not mapped yet.`,'warn');return}
    modal('Create '+title,`<label>Name / title<input id="newName" value="New ${esc(title)}"></label><label>Status<select id="newStatus"><option>Open</option><option>In Progress</option><option>Active</option><option>Planned</option></select></label><label>Owner / Responsible<input id="newOwner" value="Janez Demo"></label><label>Linked object<input id="newLinked" placeholder="e.g. FM-001"></label>`,()=>{
      let arr=C[key],prefix={functions:'FN',dfmea:'DF',pfmea:'PF',failureModes:'FM',causes:'C',effects:'E',preventionControls:'PC',detectionControls:'DC',processControls:'PCC',actions:'A',evidence:'EVT',validations:'VAL',changes:'CHG',rootCauseAnalyses:'RCA',eightD:'8D',pokaYoke:'PY',characteristics:'CR'}[key]||'OBJ';
      let n=1,id;do{id=`${prefix}-${String(arr.length+n).padStart(3,'0')}`;n++}while(arr.some(x=>x.id===id));
      let nm=$('#newName').value.trim(),r={id,name:nm,title:nm,status:$('#newStatus').value,owner:$('#newOwner').value,linked:$('#newLinked').value};
      if(key==='dfmea'||key==='pfmea')Object.assign(r,{s:1,o:1,d:1,initial:1,current:1,actions:'0/0'});
      if(key==='rootCauseAnalyses')Object.assign(r,{method:'Ishikawa + 5 Why',problem:nm,categories:{Man:[],Machine:[],Method:[],Material:[],Measurement:[],Environment:[]},whyChain:[]});
      if(key==='eightD')Object.assign(r,{steps:{D0:'',D1:'',D2:'',D3:'',D4:'',D5:'',D6:'',D7:'',D8:''}});
      arr.push(r);addTx('CREATE',id,'record',null,r);rebuildKnowledge();persist();state.selected=id;render();toast(`${id} created.`,'ok')
    })
  }
  function modal(title,body,onok,okLabel='Confirm'){$('#modal').innerHTML=`<h3>${esc(title)}</h3><div class="formgrid">${body}</div><p id="modalError" role="alert" class="diag-bad"></p><div class="foot"><button class="btn" id="mCancel">${onok?'Cancel':'Close'}</button>${onok?`<button class="btn primary" id="mOk">${esc(okLabel)}</button>`:''}</div>`;$('#modalBg').classList.add('open');$('#mCancel').onclick=()=>$('#modalBg').classList.remove('open');if(onok)$('#mOk').onclick=()=>{try{onok();$('#modalBg').classList.remove('open')}catch(e){$('#modalError').textContent=e.message}}}
  function rebuildKnowledge(){C.knowledge=allRecords().map(r=>({id:r.id,text:Object.entries(r).filter(([k,v])=>typeof v!=='object').map(([k,v])=>`${k}:${v}`).join(' | '),type:inferType(r.id)}));state.knowledge=C.knowledge}
  function inferType(id){if(id.startsWith('DF-'))return'DFMEA';if(id.startsWith('PF-'))return'PFMEA';if(id.startsWith('FM-'))return'FailureMode';if(id.startsWith('C-'))return'Cause';if(id.startsWith('E-'))return'Effect';if(id.startsWith('PC-'))return'PreventionControl';if(id.startsWith('DC-'))return'DetectionControl';if(id.startsWith('A-'))return'Action';if(id.startsWith('RCA-'))return'RCA';if(id.startsWith('8D-'))return'8D';if(id.startsWith('PY-'))return'PokaYoke';if(id.startsWith('SWC-'))return'SoftwareCharacteristic';if(id.startsWith('REQ-GAP-'))return'RequirementGap';if(id.startsWith('CASE-'))return'LearningCase';if(id.startsWith('FCP-'))return'FMEACreationProject';return'Object'}
  function openAI(){state.aiOpen=true;$('#aiPanel').classList.add('open');let sel=find(state.selected);if(!$('#aiLog').children.length)aiMsg(`<span class="kind">CONTEXT</span>${sel?`Selected <b>${esc(sel.id)}</b> — ${esc(sel.name||sel.title||sel.failure||'')}`:'No item selected. I can analyze the full embedded open_fmea.container.'}`)}
  function aiMsg(t,user=false){let d=document.createElement('div');d.className='msg'+(user?' user':'');d.innerHTML=t;$('#aiLog').appendChild(d);$('#aiLog').scrollTop=99999}
  function aiAnswer(q){let l=q.toLowerCase(),sel=find(state.selected),parts=[];if(sel){parts.push(`<span class="kind">FACT</span>Selected object <b>${esc(sel.id)}</b> is ${esc(sel.name||sel.title||sel.failure||'')} with status ${esc(sel.status||'n/a')}.`);if(sel.rpn||sel.initial||sel.current)parts.push(`<span class="kind">CALCULATION</span>Risk context: initial/RPN ${esc(sel.initial??sel.rpn??'—')}, current ${esc(sel.current??'—')}.`)}if(l.includes('high risk')||l.includes('risk')){let hi=[...C.dfmea,...C.pfmea,...C.failureModes].filter(x=>(x.current??x.rpn??x.initial)>=100);parts.push(`<span class="kind">FACT</span>${hi.length} loaded demo items currently meet the ≥100 threshold.`);parts.push(`<span class="kind">RECOMMENDATION</span>Review ${hi.slice(0,3).map(x=>x.id).join(', ')} first and verify linked controls/actions.`)}else if(l.includes('cause')){let top=C.causes.slice().sort((a,b)=>b.influence-a.influence)[0];parts.push(`<span class="kind">INFERENCE</span>The strongest loaded cause signal is ${top.id} “${esc(top.name)}” with influence ${top.influence}/10.`)}else if(l.includes('action')){let open=C.actions.filter(a=>a.status!=='Completed');parts.push(`<span class="kind">FACT</span>${open.length} demo actions are still open or in progress.`)}else if(l.includes('software characteristic')||l.includes('requirement gap')||l.includes('undefined requirement')){let gaps=C.requirementGaps||[],sc=C.softwareCharacteristics||[];parts.push(`<span class="kind">FACT</span>${sc.length} software characteristics and ${gaps.length} requirement gaps are indexed.`);let g=gaps[0];if(g){let s=suggestFromGap(g);parts.push(`<span class="kind">INFERENCE</span>Example gap ${esc(g.id)} maps to candidate failure mode: ${esc(g.potentialFailureMode)}.`);parts.push(`<span class="kind">RECOMMENDATION</span>Use ${esc(s.methods.join(' → '))}, then require human acceptance before creating an authoritative FMEA item.`)}}else if(l.includes('learn')||l.includes('training')||l.includes('model')){let m=C.decisionLearningModel||{},f=m.feedback||{};parts.push(`<span class="kind">FACT</span>The local decision-learning model is ${esc(m.modelType||'case-based')}; feedback: ${f.accepted||0} accepted, ${f.modified||0} modified, ${f.rejected||0} rejected.`);parts.push(`<span class="kind">RECOMMENDATION</span>Use JSONL as the portable learning corpus. Keep neural/LLM training external and import approved knowledge/results back into the container.`)}else if(l.includes('8d')){let d=(C.eightD||[])[0];parts.push(`<span class="kind">FACT</span>${d?`8D ${esc(d.id)} is ${esc(d.status)} and linked to ${esc(d.linkedFailure)}.`:'No 8D case is loaded.'}`);if(d)parts.push(`<span class="kind">RECOMMENDATION</span>Review D4 root cause, D5 permanent corrective action and D6 validation together before closure.`)}else if(l.includes('why')||l.includes('ishikawa')){let r=(C.rootCauseAnalyses||[])[0];parts.push(`<span class="kind">FACT</span>${r?`${esc(r.id)} contains ${(r.whyChain||[]).length} WHY steps and structured 6M categories.`:'No RCA is loaded.'}`);parts.push(`<span class="kind">RECOMMENDATION</span>Do not accept the final WHY as root cause until evidence and a controllable mechanism support it.`)}else if(l.includes('poka')||l.includes('mistake')){parts.push(`<span class="kind">FACT</span>${(C.pokaYoke||[]).length} poka-yoke controls are loaded.`);parts.push(`<span class="kind">RECOMMENDATION</span>Prefer prevention at source; otherwise use 100% detection with an immediate reaction plan.`)}else if(l.includes('learn')||l.includes('knowledge')||l.includes('container')){parts.push(`<span class="kind">FACT</span>The AI knowledge layer indexes ${C.knowledge.length} records from the embedded container and rebuilds after approved edits.`);parts.push(`<span class="kind">RECOMMENDATION</span>Keep authoritative changes user-confirmed; use AI only for retrieval, comparison and proposals.`)}else parts.push(`<span class="kind">RECOMMENDATION</span>Ask me about risk, causes, actions, controls, validation, change impact, or the selected object.`);let related=(C.learningCases||[]).filter(c=>c.approved).map(c=>({c,score:caseScore(q,c)})).filter(x=>x.score>.15).sort((a,b)=>b.score-a.score).slice(0,3);if(related.length)parts.push('<span class="kind">RECOMMENDATION</span>Relevant reviewed cases:<br>'+related.map(({c})=>esc(c.id+' — '+c.action)+'<br><small>Sources: '+esc((c.sources||[]).join(', '))+'</small>').join('<br>'));let src=sel?[sel.id]:[...C.failureModes.slice(0,2).map(x=>x.id),'open_fmea.container'];parts.push(`<div class="source">Sources: ${src.map(esc).join(', ')}</div>`);aiMsg(parts.join('<br><br>'))}
  function saveSnapshot(){persist(false);markDirty(false)}
  function saveContainer(){downloadBlob(JSON.stringify(C,null,2),'open_fmea.container','application/json');markDirty(false);toast('Portable container exported.','ok')}
  function openContainer(){pickFile('.container,.json',f=>{let fr=new FileReader();fr.onload=()=>{try{let raw=JSON.parse(fr.result);if(!raw.manifest)throw Error('Missing manifest');let base=JSON.parse($('#open-fmea-container').textContent),d=normalizeContainer(deepDefaults(raw,base));let old={schema:C.manifest.schemaVersion,project:C.manifest.project};Object.keys(C).forEach(k=>delete C[k]);Object.assign(C,d);state.projectId=C.projects.find(p=>p.id===C.manifest.projectId)?.id||C.projects.find(p=>p.name===C.manifest.project)?.id||C.projects[0]?.id;persistContext();addTx('CONTAINER_IMPORT','SYSTEM','manifest',old,C.manifest);rebuildKnowledge();persist();state.selected=null;render();toast('Container loaded and checked: '+f.name,'ok')}catch(e){toast('Container was not loaded: '+e.message,'err')}};fr.readAsText(f)})}
  function init(){let base=JSON.parse($('#open-fmea-container').textContent),loaded=base,warning='';try{let saved=localStorage.getItem('open_fmea_embedded_container');if(saved)loaded=normalizeContainer(deepDefaults(JSON.parse(saved),base));else loaded=normalizeContainer(base)}catch(e){warning='Saved state could not be loaded: '+e.message+'. Embedded data restored for this session.';loaded=normalizeContainer(base)}Object.keys(C).forEach(k=>delete C[k]);Object.assign(C,loaded);state.projectId=C.projects.find(p=>p.id===C.manifest.projectId)?.id||C.projects.find(p=>p.name===C.manifest.project)?.id||C.projects[0]?.id;persistContext();if(window.innerWidth<=900){state.sidebarCollapsed=true;document.body.classList.add('sidebar-collapsed')}rebuildKnowledge();render();$('.hamb').onclick=()=>{state.sidebarCollapsed=!state.sidebarCollapsed;document.body.classList.toggle('sidebar-collapsed',state.sidebarCollapsed)};$('#notifBtn').onclick=showNotifications;$('#helpBtn').onclick=showHelp;$('#userBtn').onclick=showUser;$('#aiClose').onclick=()=>$('#aiPanel').classList.remove('open');$('#aiSend').onclick=()=>{let q=$('#aiInput').value.trim();if(!q)return;aiMsg(esc(q),true);$('#aiInput').value='';aiAnswer(q)};$('#aiInput').onkeydown=e=>{if(e.key==='Enter')$('#aiSend').click()};$('#globalSearch').oninput=e=>liveSearch(e.target.value);document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#globalSearch').focus()}if(e.key==='Escape'){$('#modalBg').classList.remove('open');$('#aiPanel').classList.remove('open');$('#searchPop').classList.remove('open')}});window.addEventListener('beforeunload',()=>{if(state.dirty)persist(true)});if(warning){let panel=document.createElement('div');panel.className='recovery-banner';panel.setAttribute('role','alert');panel.textContent=warning;$('.main').prepend(panel)}toast('Open FMEA ready.','ok')}
